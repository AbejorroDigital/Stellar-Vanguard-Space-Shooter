<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Stellar Vanguard — Juego Shoot'em Up espacial de batallas en 2D construido con Tacarigua.js v1.0.0">
    <title>Stellar Vanguard — Space Shooter</title>

    <!-- Google Font: ZenDots -->
    <style>
        @font-face {
            font-family: 'ZenDots';
            src: url('assets/fonts/ZenDots-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
    </style>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- Loading screen -->
        <div id="loading-screen">
            <div class="loading-title">STELLAR VANGUARD</div>
            <div class="loading-subtitle">Cargando recursos...</div>
            <div class="loading-bar-container">
                <div class="loading-bar-fill" id="loading-bar-fill"></div>
            </div>
            <div class="loading-percent" id="loading-percent">0%</div>
        </div>
        <!-- Canvas is created by the game -->
    </div>

    <script type="module" src="game.js"></script>
</body>
</html>
